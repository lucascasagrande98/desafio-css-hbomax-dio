<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | HBO Max</title>
    <link rel="stylesheet" href="./assets/css/login.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="navbar__logo"><img src="./assets/images/hbo-logo.svg" class="navbar__logo-image" alt="Logo da HBO"></a>
        <div class="navbar__login">
            <a href="./login.html" class="navbar__item">Entrar</a>
            <a href="#signatures" class="navbar__item navbar__item-button button">Assine agora</a>
        </div>
    </nav>

    <main class="content">
        <form class="login container">
            <h1 class="login__title">Entrar</h1>
            <label class="login__label">Você tem uma conta da HBO Max?</label>
            <input type="email" name="email" id="email" class="login__fields" placeholder="Endereço de e-mail">
            <input type="password" name="password" id="password" class="login__fields" placeholder="Senha">
            <div class="login__buttons">
                <button type="submit" class="button button--gradient">Entrar</button>
                <a href="" class="login__link">Esqueceu a senha?</a>
            </div>
        </form>
    </main>

    <footer class="footer__container">
        <div class="footer__links">
            <a class="footer__link" href="https://www.hbomax.com/br/pt/sitemap">
                Agora na HBO Max
            </a>
            <a class="footer__link" href="https://www.hbomax.com/br/pt/coming-soon">
                Em breve
            </a>
            <a class="footer__link" href="https://www.hbomax.com/br/pt/movies">
                Filme em destaque
            </a>
            <a class="footer__link" href="https://www.hbomax.com/br/pt/shows">
                Séries
            </a>
            <a class="footer__link" href="https://help.hbomax.com/br/Home/Index">
                Ajuda
            </a>
        </div>

        <p class="footer__copyright">
            © 2022 WarnerMedia Direct Latin America, LLC. Todos os direitos reservados. HBO Max é usado sob licença.
        </p>

        <div class="footer__medias">
            <a class="footer__medias-link" href="https://www.facebook.com/HBOMaxBrasil/">
                <img src="./assets/images/fb_0.png" alt="Logo do facebook">
            </a>
            <a class="footer__medias-link" href="https://x.com/HBOMaxBrasil">
                <img src="./assets/images/twitter_0.png" alt="Logo do twitter">
            </a>
            <a class="footer__medias-link" href="https://www.instagram.com/hbomaxbrasil/">
                <img src="./assets/images/instagram_0.png" alt="Logo do instagram">
            </a>
            <a class="footer__medias-link" href="https://www.youtube.com/channel/UCR7ZwQz60rW9dK59Dirdc8w">
                <img src="./assets/images/youtube_0.png" alt="Logo do youtube">
            </a>
        </div>
    </footer>
</body>
</html>
